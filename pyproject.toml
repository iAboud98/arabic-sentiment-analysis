[project]
name = "arabic-sentiment-analysis"
version = "0.1.0"
description = "Reproducible Arabic sentiment analysis experiments on ArSarcasm-v2."
requires-python = ">=3.12,<3.13"
dependencies = [
    "emoji>=2.14,<3",
    "gensim>=4.3,<5",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "nltk>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<1",
    "torch>=2.4,<3",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

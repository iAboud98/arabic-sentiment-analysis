project:
  name: arabic-sentiment-analysis
  seed: 42

paths:
  raw_data: data/raw
  processed_data: data/processed
  results: results
  figures: reports/figures
  tables: reports/tables
  artifacts: artifacts

data:
  expected_columns:
    - tweet
    - sarcasm
    - sentiment
    - dialect
  text: tweet
  target: sentiment
  classes:
    - NEG
    - NEU
    - POS
  class_names:
    NEG: Negative
    NEU: Neutral
    POS: Positive
  auxiliary_labels:
    - sarcasm
    - dialect

split:
  train_size: 0.60
  validation_size: 0.20
  test_size: 0.20
  stratify_by: sentiment
  group_duplicate_text: true
  group_by_processed_text: true
  n_group_folds: 5
  partition_folds:
    train:
      - 0
      - 1
      - 2
    validation:
      - 3
    test:
      - 4
  target_conflict_policy: drop_group
  duplicate_policy: collapse

runtime:
  device: auto
  deterministic: true
  num_workers: 0

evaluation:
  primary_metric: f1_macro
  final_seeds:
    - 42
    - 1337
    - 2026

preprocessing:
  decode_html_entities: true
  remove_html_tags: true
  remove_urls: true
  replace_mentions: true
  demojize_emojis: true
  unpack_hashtags: true
  normalize_arabic_characters: true
  remove_diacritics: true
  remove_tatweel: true
  normalize_digits: true
  remove_punctuation_symbols: true
  collapse_repeated_characters: true
  remove_stopwords: true
  lemmatize_arabic_tokens: true
  stem_arabic_tokens: false
  preserve_negation: true

features:
  tfidf:
    analyzer: word
    token_pattern: '(?u)\b\w+\b'
    lowercase: false
    ngram_range:
      - 1
      - 2
    min_df: 2
    max_df: 0.98
    max_features: 50000
    sublinear_tf: true
    norm: l2
    dtype: float32
  word2vec:
    vector_size: 200
    window: 5
    min_count: 2
    sg: 1
    negative: 10
    sample: 0.001
    epochs: 20
    workers: 1

models:
  multinomial_nb:
    search_space:
      alpha:
        - 0.01
        - 0.1
        - 0.5
        - 1.0
        - 2.0
      fit_prior:
        - true
        - false
  gaussian_nb:
    search_space:
      var_smoothing:
        - 1.0e-6
        - 1.0e-5
        - 1.0e-4
        - 1.0e-3
        - 1.0e-2
        - 1.0e-1
        - 1.0
  random_forest:
    fixed_parameters:
      criterion: gini
      max_features: sqrt
      bootstrap: true
      class_weight: null
      n_jobs: -1
    search_space:
      n_estimators:
        - 200
        - 400
      max_depth:
        - null
        - 40
      min_samples_leaf:
        - 1
        - 2
